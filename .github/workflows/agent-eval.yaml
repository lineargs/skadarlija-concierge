name: Agent eval gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  replay-gate:
    # Replays the quality gate on the committed pre-run results (demo/v1, v4, v5).
    # Needs no Google Cloud credentials, so it runs on every push and pull request, forks included.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: "v1 -> v4 must FAIL: the gate has to catch the Serbian regression"
        run: |
          if python scripts/eval_gate.py demo/v1/results.json demo/v4/results.json \
               --dataset tests/eval/datasets/concierge-dataset.json; then
            echo "::error::The gate passed v4, but v4 breaks every Serbian conversation."
            exit 1
          fi

      - name: "v4 -> v5 must PASS: the one-line fix"
        run: |
          python scripts/eval_gate.py demo/v4/results.json demo/v5/results.json \
            --dataset tests/eval/datasets/concierge-dataset.json

  # Live evaluation: runs the agent and the judges for real on Vertex AI, then gates
